name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pulsecheck_test
          POSTGRES_USER: pulsecheck_test
          POSTGRES_PASSWORD: pulsecheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsecheck_test -d pulsecheck_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: pulsecheck_test
      PGUSER: pulsecheck_test
      PGPASSWORD: pulsecheck_test
      PGSSLMODE: disable
      PULSETEST_PGDATABASE: pulsecheck_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run backend and integration tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
