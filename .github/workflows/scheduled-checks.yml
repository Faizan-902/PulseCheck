name: Scheduled checks

on:
  schedule:
    # 15 minutes is intentional. Neon Free suspends compute only after 5 minutes of
    # inactivity (100 CU-hours/project/month). A cadence at or below 5 minutes keeps the
    # shared Preview compute awake 24/7 (~180 CU-hours/month), which suspends the database
    # and the Vercel API until the next billing period. Do not shorten this cron.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-checks
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGPORT: '5432'
      PGSSLMODE: require
      PGPOOL_MAX: '2'
      PULSECHECK_DISABLE_DOTENV: 'true'
      WORKER_BATCH_SIZE: '100'
      FRONTEND_ORIGIN: https://pulsecheck-seven.vercel.app
      NODE_ENV: production
      SESSION_COOKIE_SECURE: 'true'
      SESSION_COOKIE_SAME_SITE: lax
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --workspace server --include-workspace-root
      - name: Run one scheduled check cycle
        run: node server/src/worker-once.js
